<!doctype html>
<html lang="ja" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #0a0a0a;
        font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
        color: #f5f5f5;
      }

      .bg {
        position: absolute; inset: 0;
        width: 1080px; height: 1920px;
        background:
          radial-gradient(circle at 50% 20%, rgba(255,52,100,0.06), transparent 55%),
          radial-gradient(circle at 50% 85%, rgba(232,255,58,0.06), transparent 60%),
          #0a0a0a;
      }

      .pr-badge {
        position: absolute; top: 50px; right: 40px;
        background: rgba(255,52,100,0.92); color: #fff;
        padding: 12px 26px; border-radius: 28px;
        font-size: 30px; font-weight: 900;
        letter-spacing: 2px; z-index: 1000;
      }

      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-content {
        width: 100%; height: 100%;
        padding: 140px 60px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        box-sizing: border-box; gap: 30px;
      }

      /* Hook */
      .scene-hook .label {
        font-size: 36px; font-weight: 900; color: #ff3464;
        letter-spacing: 10px;
      }
      .scene-hook .big-num {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 480px; line-height: 0.8;
        color: #ff3464; letter-spacing: -8px;
      }
      .scene-hook .big-text {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 140px; line-height: 0.95;
        color: #f5f5f5; text-align: center;
        letter-spacing: -2px;
      }
      .scene-hook .sub {
        font-size: 52px; font-weight: 900; color: #888;
      }

      /* Problem */
      .stat-card {
        width: 880px; padding: 38px 50px;
        background: #1a1010; border: 3px solid #ff3464;
        border-radius: 16px;
        display: flex; justify-content: space-between; align-items: center;
      }
      .stat-card .label-l {
        font-size: 44px; font-weight: 800; color: #f5f5f5;
      }
      .stat-card .value {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 100px; line-height: 0.85;
        color: #ff3464; font-variant-numeric: tabular-nums;
      }

      .problem-headline {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 96px; line-height: 0.95;
        color: #ff3464; text-align: center;
        letter-spacing: -2px;
      }

      /* Realization */
      .realize-pre {
        font-size: 44px; font-weight: 800; color: #888;
        letter-spacing: 4px;
      }
      .realize-headline {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 360px; line-height: 0.85;
        color: #e8ff3a; text-align: center;
        letter-spacing: -8px;
      }
      .realize-sub {
        font-size: 72px; font-weight: 900;
        color: #f5f5f5; text-align: center; line-height: 1.1;
        max-width: 920px;
      }
      .realize-tag {
        font-size: 40px; font-weight: 800; color: #ff3464;
        letter-spacing: 3px;
      }

      /* Solution */
      .scene-solution .scene-content { padding: 110px 60px; gap: 24px; }
      .solution-label {
        font-size: 38px; font-weight: 900; color: #22e0ff;
        letter-spacing: 6px;
      }
      .product-image-wrap {
        width: 600px; height: 600px;
        border-radius: 18px; overflow: hidden;
        background: #14140a;
      }
      .product-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .product-name {
        font-size: 56px; font-weight: 800; color: #f5f5f5;
        text-align: center; line-height: 1.1;
      }
      .ba-row {
        display: flex; align-items: center; gap: 24px;
        margin-top: 20px;
      }
      .ba-col {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      .ba-col .lbl {
        font-size: 26px; font-weight: 800; color: #888;
        letter-spacing: 4px;
      }
      .ba-col .num {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 130px; line-height: 0.85;
        font-variant-numeric: tabular-nums;
      }
      .ba-col.before .num { color: #ff3464; }
      .ba-col.after .num { color: #e8ff3a; }
      .ba-arrow {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 96px; color: #22e0ff;
      }
      .duration-tag {
        font-size: 36px; font-weight: 900; color: #22e0ff;
        margin-top: 16px;
      }

      /* CTA */
      .cta-arrow {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 320px; color: #e8ff3a; line-height: 0.8;
      }
      .cta-title {
        font-family: 'Anton', 'Inter', sans-serif;
        font-size: 116px; line-height: 0.98;
        color: #f5f5f5; text-align: center;
        letter-spacing: -2px;
      }
      .cta-sub {
        font-size: 50px; font-weight: 900;
        color: #e8ff3a; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="story" data-start="0" data-duration="30" data-width="1080" data-height="1920">

      <div id="bg" class="clip bg" data-start="0" data-duration="30" data-track-index="0"></div>
      <div id="pr-badge" class="clip pr-badge" data-start="0" data-duration="30" data-track-index="5">#PR / Amazonアソシエイト</div>

      <!-- Scene 1: Hook (0-3.3s) -->
      <div id="s1" class="clip scene scene-hook" data-start="0" data-duration="3.3" data-track-index="1">
        <div class="scene-content">
          <div class="label" id="s1-label">▼ 失敗談</div>
          <div class="big-num" id="s1-num">3</div>
          <div class="big-text" id="s1-text">年やって<br/>稼げなかった</div>
          <div class="sub" id="s1-sub">私の話</div>
        </div>
      </div>

      <!-- Scene 2: Problem (3-9.3s) -->
      <div id="s2" class="clip scene scene-problem" data-start="3" data-duration="6.3" data-track-index="2">
        <div class="scene-content">
          <div class="problem-headline" id="s2-head">続かなかった理由</div>
          <div class="stat-card" id="s2-card1">
            <div class="label-l">TikTok 再生数</div>
            <div class="value">0</div>
          </div>
          <div class="stat-card" id="s2-card2">
            <div class="label-l">読んだ本</div>
            <div class="value">0</div>
          </div>
          <div class="stat-card" id="s2-card3">
            <div class="label-l">月の収益</div>
            <div class="value">¥0</div>
          </div>
        </div>
      </div>

      <!-- Scene 3: Realization (9-16.3s) -->
      <div id="s3" class="clip scene scene-realize" data-start="9" data-duration="7.3" data-track-index="1">
        <div class="scene-content">
          <div class="realize-pre" id="s3-pre">あるとき</div>
          <div class="realize-headline" id="s3-head">気づいた</div>
          <div class="realize-sub" id="s3-sub">続かないのはやる気じゃない<br/>習慣化してないだけ</div>
          <div class="realize-tag" id="s3-tag">▼ だから</div>
        </div>
      </div>

      <!-- Scene 4: Solution (16-25.3s) -->
      <div id="s4" class="clip scene scene-solution" data-start="16" data-duration="9.3" data-track-index="2">
        <div class="scene-content">
          <div class="solution-label" id="s4-label">▼ これに毎日書いた</div>
          <div class="product-image-wrap" id="s4-img">
            <img src="assets/products/product-3.svg" alt="習慣化ジャーナル" />
          </div>
          <div class="product-name" id="s4-name">習慣化ジャーナル ¥3,300</div>
          <div class="ba-row" id="s4-ba">
            <div class="ba-col before">
              <div class="lbl">BEFORE</div>
              <div class="num">¥0</div>
            </div>
            <div class="ba-arrow">→</div>
            <div class="ba-col after">
              <div class="lbl">AFTER</div>
              <div class="num">¥50,000</div>
            </div>
          </div>
          <div class="duration-tag" id="s4-dur">3ヶ月で月収50K突破</div>
        </div>
      </div>

      <!-- Scene 5: CTA (25-30s) -->
      <div id="s5" class="clip scene scene-cta" data-start="25" data-duration="5" data-track-index="1">
        <div class="scene-content">
          <div class="cta-arrow" id="s5-arrow">↑</div>
          <div class="cta-title" id="s5-title">プロフリンク<br/>の3位</div>
          <div class="cta-sub" id="s5-sub">保存→飛べ</div>
        </div>
      </div>

      <!-- Audio narration -->
      <audio id="aud-s1" class="clip" data-start="0.4"  data-duration="2.5" data-track-index="3" src="assets/audio/story/01-hook.mp3"></audio>
      <audio id="aud-s2" class="clip" data-start="3.4"  data-duration="5.5" data-track-index="3" src="assets/audio/story/02-problem.mp3"></audio>
      <audio id="aud-s3" class="clip" data-start="9.4"  data-duration="6.5" data-track-index="3" src="assets/audio/story/03-realize.mp3"></audio>
      <audio id="aud-s4" class="clip" data-start="16.4" data-duration="8.5" data-track-index="3" src="assets/audio/story/04-solution.mp3"></audio>
      <audio id="aud-s5" class="clip" data-start="25.6" data-duration="3.5" data-track-index="3" src="assets/audio/story/05-cta.mp3"></audio>

      <!-- Optional BGM (place file at assets/audio/bgm.mp3) -->
      <audio id="aud-bgm" class="clip" data-start="0" data-duration="30" data-track-index="4" src="assets/audio/bgm.mp3" data-volume="0.18"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1: Hook (0-3.3)
      tl.from('#s1',       { opacity: 0, duration: 0.25, ease: 'power2.out' }, 0);
      tl.from('#s1-label', { y: -30, opacity: 0, duration: 0.4, ease: 'power2.out' }, 0.1);
      tl.from('#s1-num',   { scale: 1.6, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, 0.3);
      tl.from('#s1-text',  { y: 60, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.7);
      tl.from('#s1-sub',   { opacity: 0, duration: 0.4, ease: 'power2.out' }, 1.2);

      // Scene 2: Problem (3-9.3)
      tl.from('#s2',         { opacity: 0, duration: 0.3, ease: 'power2.out' }, 3);
      tl.from('#s2-head',    { y: 50, opacity: 0, duration: 0.5, ease: 'power3.out' }, 3.15);
      tl.from('#s2-card1',   { x: -120, opacity: 0, duration: 0.45, ease: 'expo.out' }, 3.6);
      tl.from('#s2-card2',   { x: -120, opacity: 0, duration: 0.45, ease: 'expo.out' }, 4.5);
      tl.from('#s2-card3',   { x: -120, opacity: 0, duration: 0.45, ease: 'expo.out' }, 5.4);

      // Scene 3: Realization (9-16.3)
      tl.from('#s3',         { opacity: 0, duration: 0.3, ease: 'power2.out' }, 9);
      tl.from('#s3-pre',     { y: 30, opacity: 0, duration: 0.4, ease: 'power2.out' }, 9.2);
      tl.from('#s3-head',    { scale: 1.4, opacity: 0, duration: 0.6, ease: 'back.out(2)' }, 9.6);
      tl.from('#s3-sub',     { y: 40, opacity: 0, duration: 0.55, ease: 'power3.out' }, 11.0);
      tl.from('#s3-tag',     { opacity: 0, duration: 0.4, ease: 'power2.out' }, 13.5);

      // Scene 4: Solution (16-25.3)
      tl.from('#s4',         { opacity: 0, duration: 0.3, ease: 'power2.out' }, 16);
      tl.from('#s4-label',   { y: -30, opacity: 0, duration: 0.4, ease: 'power2.out' }, 16.15);
      tl.from('#s4-img',     { y: 60, scale: 0.92, opacity: 0, duration: 0.55, ease: 'power3.out' }, 16.4);
      tl.from('#s4-name',    { y: 30, opacity: 0, duration: 0.45, ease: 'power2.out' }, 17.0);
      tl.from('#s4-ba',      { y: 40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 17.5);
      tl.from('#s4-dur',     { scale: 0.7, opacity: 0, duration: 0.5, ease: 'back.out(1.8)' }, 19.0);

      // Scene 5: CTA (25-30, last scene — fade out allowed)
      tl.from('#s5',        { opacity: 0, duration: 0.3, ease: 'power2.out' }, 25);
      tl.from('#s5-arrow',  { y: 80, opacity: 0, duration: 0.55, ease: 'back.out(2)' }, 25.15);
      tl.from('#s5-title',  { y: 50, opacity: 0, duration: 0.5, ease: 'power3.out' }, 25.4);
      tl.from('#s5-sub',    { y: 30, opacity: 0, duration: 0.4, ease: 'expo.out' }, 25.75);
      tl.to  ('#s5',        { opacity: 0, duration: 0.5, ease: 'power2.in' }, 29.3);

      window.__timelines['story'] = tl;
    </script>
  </body>
</html>
