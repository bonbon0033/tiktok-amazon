<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d28"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#g2)"/>
  <rect x="0" y="900" width="1080" height="1020" fill="#2b2f3d"/>
  <rect x="0" y="900" width="1080" height="60" fill="rgba(0,0,0,0.3)"/>

  <!-- Scattered papers -->
  <g transform="rotate(18 230 1080)">
    <rect x="150" y="980" width="240" height="320" fill="#e8e2d0" opacity="0.92" stroke="#888" stroke-width="2"/>
    <line x1="180" y1="1060" x2="360" y2="1060" stroke="#666" stroke-width="3"/>
    <line x1="180" y1="1110" x2="340" y2="1110" stroke="#999" stroke-width="2"/>
    <line x1="180" y1="1160" x2="320" y2="1160" stroke="#999" stroke-width="2"/>
    <line x1="180" y1="1210" x2="350" y2="1210" stroke="#999" stroke-width="2"/>
  </g>
  <g transform="rotate(-12 500 1180)">
    <rect x="420" y="1020" width="220" height="310" fill="#d4ccbe" opacity="0.88" stroke="#666" stroke-width="2"/>
    <line x1="450" y1="1100" x2="610" y2="1100" stroke="#777" stroke-width="3"/>
    <line x1="450" y1="1150" x2="590" y2="1150" stroke="#999" stroke-width="2"/>
    <line x1="450" y1="1200" x2="600" y2="1200" stroke="#999" stroke-width="2"/>
  </g>
  <g transform="rotate(28 760 1130)">
    <rect x="680" y="1010" width="230" height="320" fill="#c7bea8" opacity="0.90" stroke="#888" stroke-width="2"/>
    <line x1="710" y1="1090" x2="880" y2="1090" stroke="#777" stroke-width="3"/>
    <line x1="710" y1="1140" x2="860" y2="1140" stroke="#999" stroke-width="2"/>
  </g>

  <!-- Pen tossed -->
  <g transform="rotate(35 280 1380)">
    <rect x="250" y="1340" width="220" height="14" rx="6" fill="#1a1a1a"/>
    <rect x="450" y="1336" width="30" height="22" fill="#ff3464"/>
  </g>
  <!-- Crumpled paper -->
  <ellipse cx="850" cy="1500" rx="80" ry="60" fill="#d8d2c2" opacity="0.85" stroke="#666" stroke-width="2"/>
  <ellipse cx="850" cy="1500" rx="60" ry="40" fill="none" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="850" cy="1500" rx="40" ry="25" fill="none" stroke="#aaa" stroke-width="1.5"/>
</svg>
