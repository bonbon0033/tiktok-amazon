<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="g3warm" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#3a2f1a"/>
      <stop offset="50%" stop-color="#1f1812"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="g3light" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0%" stop-color="rgba(232,255,58,0.18)"/>
      <stop offset="60%" stop-color="rgba(232,180,90,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#g3warm)"/>
  <rect width="1080" height="1920" fill="url(#g3light)"/>

  <!-- Open notebook -->
  <g transform="translate(140 660)">
    <rect width="800" height="980" rx="14" fill="#f5f1e3" stroke="#cfc6ad" stroke-width="3"/>
    <!-- Spine -->
    <rect x="395" y="0" width="10" height="980" fill="#cfc6ad"/>
    <!-- Page lines (left) -->
    <line x1="50" y1="100" x2="370" y2="100" stroke="#a8a08a" stroke-width="2.5"/>
    <line x1="50" y1="180" x2="370" y2="180" stroke="#a8a08a" stroke-width="2"/>
    <line x1="50" y1="260" x2="370" y2="260" stroke="#a8a08a" stroke-width="2"/>
    <line x1="50" y1="340" x2="370" y2="340" stroke="#a8a08a" stroke-width="2"/>
    <line x1="50" y1="420" x2="370" y2="420" stroke="#a8a08a" stroke-width="2"/>
    <!-- Handwriting on left -->
    <path d="M 70 95 Q 110 88 150 95 T 230 92 T 300 96" stroke="#222" stroke-width="3.5" fill="none"/>
    <path d="M 70 175 Q 130 168 190 175 T 280 172" stroke="#222" stroke-width="3" fill="none"/>
    <path d="M 70 255 Q 100 250 140 256 T 220 252 T 290 256" stroke="#222" stroke-width="3" fill="none"/>
    <path d="M 70 335 Q 110 330 170 336 T 250 332" stroke="#222" stroke-width="3" fill="none"/>

    <!-- Page lines (right) -->
    <line x1="430" y1="100" x2="750" y2="100" stroke="#a8a08a" stroke-width="2.5"/>
    <line x1="430" y1="180" x2="750" y2="180" stroke="#a8a08a" stroke-width="2"/>
    <line x1="430" y1="260" x2="750" y2="260" stroke="#a8a08a" stroke-width="2"/>
    <!-- Fresh ink -->
    <path d="M 450 95 Q 490 88 540 95" stroke="#222" stroke-width="3.5" fill="none"/>
    <path d="M 450 175 Q 510 170 580 178" stroke="#222" stroke-width="3" fill="none"/>
  </g>

  <!-- Pen in hand -->
  <g transform="rotate(40 720 1380)">
    <rect x="640" y="1300" width="22" height="240" rx="4" fill="#0a0a0a"/>
    <polygon points="640,1300 651,1280 662,1300" fill="#ff3464"/>
    <rect x="640" y="1330" width="22" height="4" fill="#ff3464"/>
  </g>
</svg>
